<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deebak AI Agent</title>
<style>
:root{--accent:#8294ff;--bg:rgba(10,14,32,.9);--text:#f7f8ff;--muted:#a8b0ca}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Segoe UI,Inter,system-ui,sans-serif;color:var(--text)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:999999}.orb{position:fixed;right:28px;bottom:28px;width:68px;height:68px;border-radius:50%;pointer-events:auto;cursor:pointer;background:radial-gradient(circle at 35% 25%,#fff 0 9%,#dbe3ff 16%,#889bff 35%,#4b5ce8 60%,#11153e 100%);box-shadow:0 0 22px #596effaa,0 0 58px #596eff55,inset 0 0 20px #fff5;animation:float 4s ease-in-out infinite;transition:transform .12s ease,box-shadow .2s ease}.orb:before{content:"";position:absolute;width:22px;height:22px;left:23px;top:20px;border-radius:50%;background:radial-gradient(circle,#fff,#fff2 65%,transparent 70%);filter:blur(1px)}.orb:after{content:"";position:absolute;inset:-10px;border:1px solid #8294ff66;border-radius:50%;animation:ring 3s ease-in-out infinite}
.panel{position:fixed;right:25px;bottom:112px;width:300px;padding:17px;border:1px solid #fff2;border-radius:18px;background:var(--bg);backdrop-filter:blur(20px);box-shadow:0 12px 42px #0006;opacity:0;transform:translateY(10px) scale(.96);transition:.2s;pointer-events:none}.open .panel{opacity:1;transform:none}.heading{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}.state{margin-top:11px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em}.command{margin-top:7px;font-size:14px;line-height:1.4;word-break:break-word}.action{margin-top:11px;color:var(--muted);font-size:12px;min-height:17px}.meta{margin-top:10px;color:#737c9e;font-size:10px}.stop{margin-top:14px;width:100%;border:0;border-radius:9px;padding:8px;background:#ef5268;color:#fff;font-weight:700;cursor:pointer}.wave{position:fixed;right:105px;bottom:49px;display:flex;align-items:center;gap:3px;height:35px;opacity:0;transition:opacity .15s}.wave i{display:block;width:3px;height:7px;border-radius:5px;background:var(--accent);transition:height .06s}.listening .wave,.speaking .wave{opacity:1}
.idle .orb{opacity:.88}.listening .orb{animation:pulse 1.1s ease-in-out infinite,float 4s ease-in-out infinite;box-shadow:0 0 28px #8294ffdd,0 0 78px #8294ff77}.thinking .orb{animation:pulse .8s ease-in-out infinite}.executing .orb{animation:pulse .52s ease-in-out infinite}.speaking .orb{animation:pulse .45s ease-in-out infinite}.success .orb{animation:success .8s ease-out}.error .orb{animation:shake .4s ease-in-out infinite;box-shadow:0 0 30px #ef5268cc}.interrupted .orb{box-shadow:0 0 30px #f5b942aa}
@keyframes float{50%{transform:translateY(-5px)}}@keyframes ring{50%{transform:scale(1.08);opacity:.7}}@keyframes pulse{50%{transform:scale(1.1)}}@keyframes success{40%{transform:scale(1.25)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(max-width:600px){.orb{right:18px;bottom:20px;width:58px;height:58px}.panel{right:15px;bottom:92px;width:calc(100vw - 30px);max-width:320px}.wave{right:85px;bottom:38px}}
</style>
</head>
<body>
<div id="hud" class="idle"><div class="panel"><div class="heading"><span class="dot"></span><span>DEEBAK AI</span></div><div id="state" class="state">READY</div><div id="command" class="command">Waiting for your command...</div><div id="action" class="action">Agent is idle</div><div id="meta" class="meta"></div><button id="stop" class="stop">STOP</button></div><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="orb" title="Deebak AI"></div></div>
<script>
const hud=document.getElementById('hud'),state=document.getElementById('state'),command=document.getElementById('command'),action=document.getElementById('action'),meta=document.getElementById('meta'),orb=document.querySelector('.orb'),bars=[...document.querySelectorAll('.wave i')];let current='idle',timer;
const names={idle:'READY',listening:'LISTENING',thinking:'THINKING',planning:'PLANNING',executing:'EXECUTING',observing:'OBSERVING',verifying:'VERIFYING',recovering:'RECOVERING',speaking:'SPEAKING',success:'COMPLETED',error:'NEED HELP',interrupted:'STOPPED'};
function setState(next,text='',detail=''){current=next;hud.className=next+(next!=='idle'?' open':'');state.textContent=names[next]||next.toUpperCase();if(text)command.textContent=text;if(detail)action.textContent=detail;if(next==='idle')stopWave();if(next==='listening'||next==='speaking')startWave()}
function level(value){const n=Math.max(0,Math.min(1,Number(value)||0));orb.style.transform=`scale(${1+n*.3})`;bars.forEach((bar,i)=>bar.style.height=`${6+n*(10+Math.sin(Date.now()/100+i)*10)}px`)}
function startWave(){clearInterval(timer);timer=setInterval(()=>level(.15+Math.random()*.75),70)}function stopWave(){clearInterval(timer);timer=null;level(0)}
function normalize(data){if(!data)return{};const p=data.payload||{};return {...p,...data,event:data.event||data.event_type}}
function agentEvent(raw){const d=normalize(raw),e=d.event||'';meta.textContent=[d.session_id,d.task_id,d.action_id].filter(Boolean).join('  ·  ');if(e==='voice.partial'||e==='voice.transcript'||e==='listening')return setState('listening',d.text||d.raw_input||'Listening...',d.action||'Microphone active');if(e==='voice.state'){const map={LISTENING:'listening',UNDERSTANDING:'thinking',EXECUTING:'executing',RESPONDING:'speaking',IDLE:'idle'};return setState(map[d.state]||'thinking',d.text||'',d.action||'');}if(e==='intent.detected'||e==='thinking')return setState('thinking',d.text||d.intent||'Understanding...',d.action||'Processing command');if(e==='task.created'||e==='plan.created'||e==='planning')return setState('planning',d.text||'Planning task...',d.action||'Preparing safe actions');if(e==='action.started'||e==='executing')return setState('executing',d.text||d.instruction||'Executing...',d.action||'Agent is working');if(e==='mouse.move'||e==='mouse_move')return setState('executing',d.text||'Controlling mouse',`Mouse → ${d.x}, ${d.y}`);if(e==='mouse.click'||e==='mouse_click')return setState('executing',d.text||'Mouse click',`Click → ${d.x}, ${d.y}`);if(e==='keyboard.typing'||e==='typing')return setState('executing',d.text||'Typing...',`Keyboard input${d.length?' · '+d.length+' chars':''}`);if(e==='verification.started'||e==='verifying')return setState('verifying',d.text||'Checking expected state',d.action||'Observing result');if(e==='verification.success'||e==='success'||e==='task.completed') {setState('success',d.text||'Task completed','✓ Verified successfully');setTimeout(()=>setState('idle'),1600);return}if(e==='recovery.started'||e==='recovering')return setState('recovering',d.text||'Recovering...',d.action||'Trying next safe strategy');if(e==='task.interrupted'||e==='interrupt.detected'||e==='task.cancelled')return setState('interrupted',d.text||'Task stopped','Input released');if(e==='error'||e==='verification.failed'||e==='task.failed')return setState('error',d.text||'Task failed',d.action||'Recovery required')}
window.agentEvent=agentEvent;orb.addEventListener('click',()=>setState(current==='listening'?'thinking':'listening',current==='listening'?'Voice received':'Listening to your voice...',current==='listening'?'Processing...':'Microphone active'));document.getElementById('stop').addEventListener('click',()=>{agentEvent({event:'interrupt.detected',text:'Task stopped'});window.parent?.postMessage({type:'agent.stop'},'*')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){agentEvent({event:'interrupt.detected',text:'Task stopped'});window.parent?.postMessage({type:'agent.stop'},'*')}});setState('idle');
</script>
</body>
</html>
